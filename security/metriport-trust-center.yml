description: >-
  Metriport runs a trust center at security.metriport.com and links to it from
  the homepage. The certifications themselves are stated on the marketing site,
  not in the trust center — the trust center is a client-rendered React
  application that ships a 604-byte HTML shell with an empty #root div, so an
  unauthenticated non-JavaScript client (including every agent and crawler)
  reads zero certifications from it. Nothing was extractable from the JS bundle
  either: no SOC, HIPAA, ISO or subprocessor strings appear in it, so the
  content is fetched at runtime from an endpoint not discoverable anonymously.
