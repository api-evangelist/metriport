method: probed
source: >-
  Direct HTTP probes of the /.well-known/ discovery surface on every host named
  in apis.yml (baseURL), the OpenAPI servers[] blocks
  (https://api.metriport.com, https://api.sandbox.metriport.com), the marketing
  site and the documentation host, run 2026-08-14. Status is the HTTP code
  observed at fetch time.
description: >-
  Metriport's API hosts do not serve a /.well-known/ surface at all: every path
  on api.metriport.com and api.sandbox.metriport.com is answered with HTTP 403
  {"message":"Forbidden"} by the API gateway, which rejects unauthenticated
  requests before routing. The marketing site answers 404 with an "Invalid
  .well-known request" page. The one real document on the whole estate is the
  A2A agent card served by the documentation host — captured verbatim in
  a2a/metriport-agent-card.json — alongside the agent skill it links to. No
  security.txt, no OpenID/OAuth metadata, no api-catalog, no ai-plugin.json
  anywhere.
hosts:
  - host: https://api.metriport.com
    note: API gateway returns 403 Forbidden for every unauthenticated path, including /.well-known/*. Not a 404 — the surface is closed, not absent.
    documents:
      - {path: /.well-known/security.txt, status: 403}
      - {path: /.well-known/openid-configuration, status: 403}
      - {path: /.well-known/oauth-authorization-server, status: 403}
      - {path: /.well-known/oauth-protected-resource, status: 403}
      - {path: /.well-known/api-catalog, status: 403}
      - {path: /.well-known/ai-plugin.json, status: 403}
      - {path: /.well-known/agent-card.json, status: 403}
      - {path: /.well-known/agent.json, status: 403}
  - host: https://api.sandbox.metriport.com
    note: Same gateway behaviour as production.
    documents:
      - {path: /.well-known/security.txt, status: 403}
      - {path: /.well-known/openid-configuration, status: 403}
      - {path: /.well-known/oauth-authorization-server, status: 403}
      - {path: /.well-known/oauth-protected-resource, status: 403}
      - {path: /.well-known/api-catalog, status: 403}
      - {path: /.well-known/ai-plugin.json, status: 403}
