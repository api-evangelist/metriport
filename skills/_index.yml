description: >-
  Metriport is one of the small number of providers in this catalogue that
  publishes an Agent Skill itself. That file is kept unmodified. The generated
  skills sit alongside it and cover the three flows an integrator actually has
  to get right: the consolidated FHIR query, document retrieval, and webhook
  onboarding — which is a prerequisite for both of the others, because every
  long-running Metriport operation returns its result on a webhook.
